<style>
/* Layout concept: one Tube-style line across the top, ten stations = ten chapters of a serial.
   A station stays locked until the quiz at the previous one is passed. Below it, a calm reading column. */
:root {
  --bg: #eef0f2;
  --surface: #fbfbfa;
  --ink: #18202c;
  --muted: #5d6877;
  --rule: #d3d8de;
  --accent: #1c4ea0;
  --accent-ink: #ffffff;
  --accent-soft: #dbe5f6;
  --good: #1d7a4a;
  --good-soft: #d9efe2;
  --bad: #b3261e;
  --bad-soft: #f7dcd9;
  --hl: #fff0b8;
  --display: "Cormorant Garamond", "Noto Serif TC", Georgia, serif;
  --read: "Literata", Georgia, "Times New Roman", serif;
  --ui: "Noto Sans TC", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151b; --surface: #1a2029; --ink: #e7ebf0; --muted: #9aa5b4; --rule: #2d3643;
    --accent: #7ea6ee; --accent-ink: #0d1522; --accent-soft: #1f2c44;
    --good: #5fcf97; --good-soft: #173627; --bad: #f08a82; --bad-soft: #3d1e1c; --hl: #3a3414;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151b; --surface: #1a2029; --ink: #e7ebf0; --muted: #9aa5b4; --rule: #2d3643;
  --accent: #7ea6ee; --accent-ink: #0d1522; --accent-soft: #1f2c44;
  --good: #5fcf97; --good-soft: #173627; --bad: #f08a82; --bad-soft: #3d1e1c; --hl: #3a3414;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 15px; line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 22px 56px;
}
.wrap { max-width: 720px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }

/* header */
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.brand { font-family: var(--display); font-weight: 600; font-size: clamp(2.4rem, 9vw, 3.4rem); line-height: 1.02; letter-spacing: -.01em; margin-top: 6px; text-wrap: balance; }
.brand-sub { color: var(--muted); margin-top: 8px; }
.tabs { display: flex; gap: 0; margin-top: 22px; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; width: fit-content; background: var(--surface); }
.tabs button { border: 0; background: transparent; padding: 8px 22px; font-weight: 500; }
.tabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* the line: stations grouped by part */
.partlab { display: flex; justify-content: space-between; align-items: baseline; margin: 26px 0 0; font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.partlab b { font-family: var(--display); font-size: 15px; color: var(--ink); letter-spacing: 0; font-weight: 600; }
.partlab + .line { margin-top: 12px; }
details.part { border-bottom: 1px solid var(--rule); }
details.part > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 14px 2px; font-family: var(--display); font-weight: 600; font-size: 16px; }
details.part > summary::-webkit-details-marker { display: none; }
details.part > summary span { font-family: var(--body, inherit); font-weight: 400; font-size: 12px; color: var(--muted); white-space: nowrap; }
details.part > summary::after { content: "＋"; color: var(--muted); font-weight: 400; }
details.part[open] > summary::after { content: "－"; }
details.part .chl { margin-top: 0; }
.line { position: relative; list-style: none; margin: 30px 0 0; padding: 0; display: grid; grid-template-columns: repeat(var(--n, 20), 1fr); }
.line::before, .line .fill { content: ""; position: absolute; top: 6px; height: 4px; left: 2.5%; border-radius: 3px; }
.line::before { right: 3.4%; background: var(--rule); }
.line .fill { background: var(--accent); width: calc(95% * var(--p, 0)); transition: width .5s ease; }
.st { position: relative; display: flex; justify-content: center; text-align: center; min-width: 0; }
.st button { border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; min-width: 0; }
.st button:disabled { cursor: not-allowed; }
.dot { width: 17px; height: 17px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 9px; background: var(--surface); border: 2px solid var(--accent); color: var(--accent); }
.st.done .dot { background: var(--accent); color: var(--accent-ink); }
.st.lock .dot { border: 2px dashed var(--muted); color: var(--muted); }
.st.cur .dot { box-shadow: 0 0 0 4px var(--accent-soft); }
.st .nm { display: none; font-size: 10px; font-weight: 500; line-height: 1.25; overflow-wrap: anywhere; }
.st.lock .nm { color: var(--muted); }
@media (min-width: 620px) {
  .line::before, .line .fill { top: 12px; }
  .dot { width: 28px; height: 28px; font-size: 12px; }
  .st .nm { display: block; }
}

/* sections */
main { margin-top: 34px; }
.guide { list-style: none; padding: 0; margin: 0 0 26px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.guide li { border-top: 2px solid var(--accent); padding-top: 8px; font-size: 13px; color: var(--muted); }
.guide b { display: block; color: var(--ink); font-size: 13px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 13px; margin-top: 6px; }
h2.title { font-family: var(--display); font-weight: 600; font-size: clamp(2rem, 7vw, 2.7rem); line-height: 1.08; margin-top: 4px; text-wrap: balance; }
.zh-title { color: var(--muted); font-size: 16px; margin-top: 2px; }
.recap { margin-top: 18px; border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 8px 14px; border-radius: 0 8px 8px 0; font-size: 14px; }

.audio { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 20px 0 14px; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 9px 16px; font-weight: 500; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.ghost[aria-pressed="true"] { background: var(--accent-soft); font-weight: 700; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 7px 12px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.voice { font-size: 12px; color: var(--muted); width: 100%; }

.passage { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: clamp(18px, 4vw, 30px); font-family: var(--read); font-size: clamp(1.05rem, 4.2vw, 1.2rem); line-height: 1.9; }
.para { margin: 0 0 1.1em; }
.para:last-child { margin-bottom: 0; }
.pair { display: inline; }
.bi .pair { display: block; margin-bottom: .55em; }
.zhl { display: block; font-family: var(--ui); font-size: .8em; line-height: 1.6; color: var(--muted); margin-top: 1px; }
.sent { cursor: pointer; border-radius: 4px; padding: 1px 0; transition: background .2s; }
.sent:hover { background: var(--accent-soft); }
.sent.now { background: var(--hl); }
.vw { background: none; border: 0; padding: 0; font: inherit; color: inherit; border-bottom: 2px dotted var(--accent); cursor: pointer; }
.vw:hover { background: var(--accent-soft); }

.wordcard { margin-top: 12px; border-left: 3px solid var(--accent); padding: 8px 14px; background: var(--accent-soft); border-radius: 0 8px 8px 0; min-height: 48px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.wordcard .w { font-family: var(--read); font-size: 1.2rem; font-weight: 500; }
.wordcard .pos { color: var(--muted); font-size: 13px; }
.mini { border: 1px solid var(--rule); background: var(--surface); border-radius: 50%; width: 32px; height: 32px; display: inline-grid; place-items: center; color: var(--accent); flex: none; }
.next { margin-top: 16px; color: var(--muted); font-size: 14px; }
.next b { color: var(--ink); margin-right: 6px; }

h3.sec { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 34px 0 6px; font-weight: 700; }
.vlist { list-style: none; padding: 0; margin: 0; }
.vlist li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); min-width: 0; }
.vlist .w { font-family: var(--read); font-weight: 500; font-size: 1.05rem; min-width: 7.5em; }
.vlist .pos { color: var(--muted); font-size: 13px; min-width: 3.2em; }
.vlist .zh { flex: 1; min-width: 0; }
.cta { margin-top: 30px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.cta p { color: var(--muted); font-size: 13px; }

/* quiz */
.q { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--rule); }
.q:first-of-type { border-top: 0; }
.q .qt { font-family: var(--read); font-size: 1.1rem; line-height: 1.6; }
.q .qn { color: var(--accent); font-weight: 700; margin-right: 6px; }
.opts { display: grid; gap: 8px; margin-top: 10px; }
.opt { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); cursor: pointer; }
.opt input { margin-top: 5px; accent-color: var(--accent); }
.opt.ok { border-color: var(--good); background: var(--good-soft); }
.opt.no { border-color: var(--bad); background: var(--bad-soft); }
.why { margin-top: 8px; font-size: 13px; color: var(--muted); }
.result { margin-top: 28px; padding: 18px; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface); }
.result.pass { border-color: var(--good); }
.result.fail { border-color: var(--bad); }
.result h3 { font-size: 1.15rem; }
.msg { color: var(--bad); font-size: 13px; margin-top: 8px; min-height: 1em; }

/* review */
.deckbar { height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; margin: 10px 0 18px; }
.deckbar i { display: block; height: 100%; background: var(--good); width: calc(100% * var(--k, 0)); }
.flash { width: 100%; text-align: center; border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 36px 18px; min-height: 220px; display: grid; place-items: center; align-content: center; gap: 10px; }
.flash .big { font-family: var(--display); font-weight: 600; font-size: clamp(2.2rem, 9vw, 3rem); line-height: 1.1; }
.flash .ctx { font-family: var(--read); color: var(--muted); font-size: 1rem; line-height: 1.7; max-width: 34em; }
.flash .ctx mark { background: var(--hl); color: inherit; border-radius: 3px; padding: 0 2px; }
.flash .hint { font-size: 12px; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.cloze { font-family: var(--read); font-size: 1.2rem; line-height: 1.9; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 22px; }
.blank { display: inline-block; min-width: 5em; border-bottom: 2px solid var(--accent); text-align: center; color: var(--accent); font-weight: 500; }
.chips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
.chip { border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 12px; font-family: var(--read); font-size: 1.05rem; }
.chip.ok { border-color: var(--good); background: var(--good-soft); }
.chip.no { border-color: var(--bad); background: var(--bad-soft); }
.score { color: var(--muted); font-size: 13px; margin-top: 10px; }

footer { margin-top: 48px; padding-top: 14px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; justify-content: space-between; }
footer button { border: 1px solid var(--rule); background: transparent; border-radius: 6px; padding: 4px 10px; font-size: 12px; color: var(--muted); }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .25s; max-width: 90vw; z-index: 20; }
#toast.on { opacity: 1; }
@media (max-width: 520px) {
  .guide { grid-template-columns: 1fr; gap: 8px; }
  .vlist .w { min-width: 6em; }
  .vlist .pos { display: none; }
}
@media (prefers-reduced-motion: reduce) { .line .fill, .sent, #toast { transition: none; } }

.badge { display: inline-block; min-width: 1.4em; padding: 0 6px; margin-left: 4px; border-radius: 10px; background: var(--bad); color: #fff; font-size: 11px; line-height: 1.6; text-align: center; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 16px 0; }
.stats div { border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 10px 6px; text-align: center; }
.stats b { display: block; font-family: var(--display); font-size: 1.7rem; line-height: 1.1; }
.stats span { font-size: 11px; color: var(--muted); }
.flabel { margin-top: 16px; font-size: 12px; color: var(--muted); }
.wrapseg { display: flex; flex-wrap: wrap; width: fit-content; max-width: 100%; margin-top: 6px; }
.blist { margin-top: 8px; border-top: 1px solid var(--rule); }
.bw { border-bottom: 1px solid var(--rule); }
.bhead { width: 100%; display: flex; align-items: baseline; gap: 10px; text-align: left; border: 0; background: transparent; padding: 11px 2px; }
.bword { font-family: var(--read); font-size: 1.1rem; font-weight: 500; min-width: 7em; }
.bpos { color: var(--muted); font-size: 12px; font-style: italic; min-width: 2.6em; }
.bz { flex: 1; }
.bbox { color: var(--good); font-size: 9px; letter-spacing: 1px; }
.bw.open { background: var(--surface); }
.bbody { padding: 4px 12px 14px; display: grid; gap: 8px; font-size: 14px; }
.bbody mark { background: var(--hl); color: inherit; border-radius: 3px; padding: 0 2px; }
.ipa { font-family: var(--read); color: var(--accent); }
.mini { border: 1px solid var(--rule); background: transparent; border-radius: 6px; padding: 2px 6px; color: var(--accent); vertical-align: middle; }
.muted { color: var(--muted); }
.bdl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.bdl dt { color: var(--muted); }
.bdl dd { margin: 0; }
.spellin { flex: 1; min-width: 0; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 10px 12px; font-family: var(--read); font-size: 1.1rem; }
.flash .okt { color: var(--good); } .flash .bad { color: var(--bad); }
@media (max-width: 520px) { .bword { min-width: 6em; } .stats b { font-size: 1.4rem; } }
/* bottom navigation, sheet, home */
body { padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
.bnav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--surface); border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 15; }
.bnav button { flex: 1; min-width: 0; border: 0; background: transparent; padding: 8px 2px 7px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); position: relative; }
.bnav button[aria-current="page"] { color: var(--accent); font-weight: 700; }
.bnav svg { width: 22px; height: 22px; }
.bnav .badge { position: absolute; top: 2px; left: calc(50% + 6px); margin: 0; }
#toast { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 18px; margin-top: 16px; }
.cover { position: relative; border-radius: 14px; overflow: hidden; margin: 4px 0 18px; aspect-ratio: 4 / 5; background: #11151b; color: #fff; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 62%; }
.cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(8,12,20,.82) 0%, rgba(8,12,20,.35) 26%, rgba(8,12,20,0) 44%, rgba(8,12,20,0) 62%, rgba(8,12,20,.85) 100%); }
.cover .ct, .cover .cb { position: absolute; left: 0; right: 0; z-index: 1; padding: 0 22px; text-align: center; }
.cover .ct { top: 20px; }
.cover .ct small { display: block; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; opacity: .85; }
.cover .ct h1 { font-family: var(--display); font-weight: 600; font-size: clamp(2.6rem, 11vw, 3.8rem); line-height: 1; margin-top: 8px; letter-spacing: .01em; text-shadow: 0 2px 18px rgba(0,0,0,.55); color: #fff; }
.cover .cb { bottom: 20px; }
.cover .cb b { display: block; font-family: var(--display); font-size: 1.35rem; font-weight: 600; line-height: 1.3; text-wrap: balance; }
.cover .cb span { display: block; margin-top: 6px; font-size: 13px; opacity: .9; }
.card.hero { border-color: var(--accent); }
.card h3 { font-family: var(--display); font-size: 1.6rem; line-height: 1.15; margin: 4px 0; }

<script>
const STORIES = [
{
 "id": 1,
 "name": "Detention",

 "title": "The Container Detention",
 "zh": "貨櫃滯留",
 "recap": "",
 "next": "當夜霧籠罩科克，分所的資料分析室還亮著燈。",
 "paras": [
  [
   [
    "In the third week of October, the Atlantic wind drove cold rain across Cork Harbour, and the container terminal lay under a sky the colour of lead.",
    "十月第三週，大西洋的風把冷雨吹過科克港，貨櫃碼頭籠罩在鉛灰色的天空下。"
   ],
   [
    "Giant cranes groaned in the grey light. Hundreds of refrigerated containers, stamped with export codes for Irish butter and cheese, stood in tidy rows, and every one of them was stuck.",
    "巨型起重機在灰光中發出沉悶的聲響。數百個冷藏貨櫃整齊排列，上面印著愛爾蘭奶油與起司的出口代碼，而每一個都動彈不得。"
   ],
   [
    "An emergency order from the European Commission had suspended their customs clearance, and the cargo could not move an inch. Every day of delay cost thousands in storage fees, and the milk powder inside would not wait.",
    "歐盟執委會的緊急命令暫停了它們的通關，整批貨物寸步難行。每延誤一天就要付上數千的倉儲費，而櫃裡的奶粉可不等人。"
   ]
  ],
  [
   [
    "In the top-floor office of O’Connor & Partners, a grey-faced operations director slammed a two-hundred-page report onto the oak table.",
    "在 O’Connor & Partners 頂樓的辦公室裡，一位臉色鐵青的營運總監把一份兩百頁的報告砸在橡木桌上。"
   ],
   [
    "“If this shipment is not cleared by Friday, we lose our access to Rotterdam. The auditors say our carbon figures are wrong, and the whole logistics chain is under suspicion.”",
    "「如果這批貨週五前不能放行，我們就失去進入鹿特丹的通道。稽核員說我們的碳數據有誤，整條物流鏈都被懷疑。」"
   ],
   [
    "Felix O’Connor did not look up. He wore a charcoal linen suit, and behind his gold-rimmed glasses his eyes studied the freight data on the screen.",
    "菲利克斯·奧康納沒有抬頭。他穿著炭灰色亞麻西裝，金邊眼鏡後的眼睛審視著螢幕上的貨運數據。"
   ],
   [
    "As head of trade compliance for the family firm in southern Ireland, he had seen many such crises, born of geopolitics and trade barriers.",
    "身為家族事務所在愛爾蘭南部的貿易合規主管，他早已見識過許多由地緣政治與貿易壁壘引發的危機。"
   ],
   [
    "The family called his move to Cork a posting. The staff whispered that it was an exile, because he had refused to help them move assets illegally in an energy merger and had quietly reported the gaps to the European regulators.",
    "家族把他調來科克稱為「派駐」。員工私下低語，那其實是流放，因為他在一宗能源併購案中拒絕協助家族非法轉移資產，還私下把漏洞舉報給歐盟監管機構。"
   ]
  ],
  [
   [
    "“It is not the customs officers’ fault.”",
    "「這不是海關人員的錯。」"
   ],
   [
    "The voice came from beside the projector screen, clear but tired. Finn Mercer was tracing a route on the map, from Cork through Britain to the European continent.",
    "聲音從投影幕旁傳來，清晰卻疲憊。芬恩·默瑟正在地圖上劃出一條路線，從科克經英國通往歐洲大陸。"
   ],
   [
    "Six weeks earlier he had been a barman at The Raven, where a customer named Declan Hayes had humiliated him and a stranger had stepped in. The stranger turned out to be his new visiting lecturer, and then, to his horror, his employer.",
    "六週前，他還是烏鴉酒吧的調酒師，一位名叫戴克蘭·海斯的客人羞辱了他，一個陌生人出面解圍。那個陌生人原來是他新來的客座教授，接著，更讓他驚愕的是，成了他的雇主。"
   ],
   [
    "He had come from England on a student visa and a heavy loan. His father had died in an accident at a fishing harbour when Finn was nine, and his mother had raised him on a small pension and a cleaner’s wages, so he knew what every euro was worth.",
    "他從英國帶著學生簽證與沉重的學貸來到這裡。他九歲時，父親在漁港的工安事故中喪生，母親靠微薄的撫恤金與清潔工的薪水把他拉扯大，所以他知道每一歐元的分量。"
   ],
   [
    "“The previous logistics contractor understated the emissions of the supply chain,” Finn said. “The Commission now evaluates the environmental impact of farm exports very strictly. If a single supplier cannot prove sustainable practice, the whole shipment is judged to be in breach.”",
    "「前一任物流承包商低報了供應鏈的排放量，」芬恩說。「執委會現在對農產品出口的環境衝擊審查極其嚴格。只要有一家供應商無法證明永續做法，整批貨就被判定違規。」"
   ]
  ],
  [
   [
    "He turned to the appendix. “The contractor ignored three things. The farms in this region consume huge amounts of imported feed, and part of it comes from land cleared by deforestation. The fertilisers contain chemicals that contaminate the rivers. And the packaging goes to landfill instead of being recycled.”",
    "他翻到附錄。「承包商漏掉三件事。這個地區的農場消耗大量進口飼料，其中一部分來自被砍伐森林開墾的土地。肥料含有污染河川的化學物質。而包裝材料被送去掩埋場，沒有回收。」"
   ],
   [
    "“Auditors do not only count carbon. They ask whether wildlife is protected, whether the habitat around the farms is preserved and whether an endangered species faces extinction. They want proof that the ecosystem will not erode further, that biodiversity is safe, and that conservation is more than a slogan.”",
    "「稽核員不只算碳。他們還問野生動物有沒有受到保護、農場周邊的棲地有沒有被保存、瀕危物種是否面臨滅絕。他們要證據證明生態系不會再受侵蝕、生物多樣性是安全的，而保育不只是口號。」"
   ],
   [
    "“And last summer’s drought altered the grazing season, so the farms generated far less renewable energy from their own biogas than they declared.”",
    "「而且去年夏天的乾旱改變了放牧季節，所以這些農場靠自家沼氣產生的再生能源，遠比他們申報的少。」"
   ]
  ],
  [
   [
    "Felix finally raised his eyes. Their colour was a deep, quiet grey. “You spent the whole night and this is your conclusion? Mr Mercer, I did not hire you to read the customs bulletin back to me. Some pollution is widespread in dairy farming. I need a solution, and a way to avoid demurrage charges without breaking the law.”",
    "菲利克斯終於抬起眼。那是深邃而安靜的灰色。「你花了一整夜，結論就這樣？默瑟先生，我請你來不是要你把海關公告唸給我聽。污染在酪農業本來就很普遍。我要的是解決方案，以及在不違法的前提下避開滯納金的辦法。」"
   ],
   [
    "Finn’s jaw tightened. “There are two. First, pay for the special green channel. That triggers an anti-subsidy investigation, and the whole chain is blacklisted for three years. Second, we rebuild the certificates, so that the carbon-neutral targets upstream are linked to the farm subsidies of southern Ireland. It needs precise data and a legal exemption, and I can do it in forty-eight hours.”",
    "芬恩的下顎繃緊。「有兩個。第一，花錢走特許綠色通道，但那會觸發反補貼調查，整條供應鏈三年內被列入黑名單。第二，重組產地證明，把上游的碳中和目標與愛爾蘭南部的農業補貼掛鉤。這需要精確的數據與法律豁免條款，而我能在四十八小時內做完。」"
   ],
   [
    "Felix leaned back in his leather chair. “Anyone can boast. If you fail, your internship assessment fails with you, and the deposit for your student visa may well drown with those containers.”",
    "菲利克斯靠向皮椅背。「誰都會說大話。如果你失敗，你的實習評定跟著不及格，你的學生簽證保證金也可能跟這批貨櫃一起泡湯。」"
   ],
   [
    "Finn’s fist closed at his side. “Watch me,” he said, and he left to restore the farms’ data, and, if possible, his own pride.",
    "芬恩的拳頭在身側握緊。「走著瞧，」他說，然後離開，去修復農場的數據，也盡可能挽回自己的自尊。"
   ]
  ]

 "recap": "董事會上，菲利克斯當眾承認是他把證據送交歐盟主管機關，為芬恩擋下了所有指控。",

 "paras": [
  [
   [
    "By evening, a gale from the Atlantic was battering the harbour, and the rain struck the glass like thrown gravel. The office was dark except for the lightning, which lit the long shadows of the room.",
    "傍晚，大西洋的狂風猛撲港口，雨點像丟出的碎石敲打玻璃。辦公室一片漆黑，只有閃電照亮房間長長的陰影。"
   ],
   [
    "Finn stood in the doorway, his voice dry. He had just heard that the board had suspended Felix indefinitely for abuse of authority and betrayal of the family’s interests, and had frozen his trust. At the desk Felix was packing a cardboard box: a heavy law book, a fountain pen he had used for years, and the gold-rimmed glasses.",
    "芬恩站在門口，聲音乾澀。他剛聽說董事會以濫用職權與背叛家族利益為由，將菲利克斯無限期停職，還凍結了他的信託。辦公桌前，菲利克斯正把物品收進紙箱：一本厚重的法律書、一支用了多年的鋼筆，還有那副金邊眼鏡。"
   ],
   [
    "“Kicked out of the inner circle by my elderly relatives,” said Felix, smiling at himself. “Are you sorry for your employer?”",
    "「被我那群年邁的親戚踢出核心圈，」菲利克斯自嘲地笑著說。「怎麼，心疼你的老闆了？」"
   ]
  ],
  [
   [
    "“The first time I reported them, in the energy merger, they did not punish me,” he added. “They exiled me to Cork, where they thought I could do no harm. They were wrong about the harbour, and wrong about you.”",
    "「我第一次舉報他們，是在那宗能源併購案，」他補充說，「他們沒有懲罰我。他們把我流放到科克，以為我在這裡做不了什麼壞事。他們看錯了港口，也看錯了你。」"
   ]
  ],
  [
   [
    "Finn crossed the room and put a hand on the box. “Why? You could have blamed me. I am an outsider. I can leave tomorrow, and nobody would investigate a student.” Felix’s eyes darkened. He told him everything, quietly, with the rain behind him.",
    "芬恩穿過房間，一手按住紙箱。「為什麼？你大可以怪到我頭上。我是外人，明天就能走，沒人會去查一個學生。」菲利克斯的眼神沉了下去。他在雨聲中，輕聲把一切都告訴了他。"
   ],
   [
    "For two years he had suspected that the old guard planned to use the terminal deal to distribute illegal rebates and divide export quotas among their friends. They moved the profit through a subsidiary and a tax haven, and the revenue the state lost was the farmers’ roads and schools. Hayes Capital’s currency deals hid the flow, and the old men blamed globalisation whenever anyone asked.",
    "兩年來，他一直懷疑守舊派打算利用碼頭交易發放非法回扣，並把出口配額分給自己人。他們透過子公司與避稅天堂轉移利潤，而國家因此少掉的稅收，就是農民的道路與學校。海斯資本的貨幣交易掩護資金流向，而每當有人問起，老人們就怪罪全球化。"
   ],
   [
    "“A recession is coming, Finn. Dairy is a commodity, and the farmers are small entrepreneurs who cannot survive a monopoly. I needed the Commission to move before the inflation of the next quarter made everyone too afraid to speak. So I used a flawed report as bait.”",
    "「衰退要來了，芬恩。乳製品是大宗商品，而農民是撐不過壟斷的小企業主。我需要執委會趕在下一季通膨讓所有人都不敢開口之前動手。所以我用一份有缺陷的報告當誘餌。」"
   ],
   [
    "“You could have told me.” “Then you would have been part of it, and you would have lied for me in front of those men. I would rather lose a firm than make you a liar.”",
    "「你可以告訴我。」「那你就成了共犯，你會當著那些人的面替我說謊。我寧可輸掉一家事務所，也不願讓你變成騙子。」"
   ]
  ],
  [
   [
    "He expected the family to offer to negotiate. They would offer compensation to the farmers, a merger of the two firms and a transparent audit in exchange for silence, and they would try to shift every liability onto him. But the Commission regulates trade by law, not by favour. The constitution of a court is not a family dinner, and a sanction, once begun, cannot be bargained away.",
    "他預料家族會提出談判。他們會向農民提出補償、兩家公司的合併與一次透明的稽核，以換取沉默，並試圖把所有責任推給他。但執委會是依法而不是依人情管制貿易。法院的憲章不是家族晚宴，而制裁一旦啟動，就無法用交易買掉。"
   ]
  ],
  [
   [
    "“I wrote your appraisal on Friday, before any of this,” Felix added, without looking up. “It says you are more qualified than any associate I have recruited. I meant to promote you. They will make you redundant, I expect, but you could work freelance, or flexibly, with fewer hours of overtime. Your productivity is a gift to any firm in Europe.”",
    "「我星期五就寫好了你的考核，在這一切發生之前，」菲利克斯頭也不抬地補充。「上面寫你比我招過的任何助理都更勝任。我本來要升你的職。我猜他們會讓你被裁員，但你可以接案，或彈性工作，少一點加班。你的生產力對歐洲任何一家事務所都是禮物。」"
   ],
   [
    "“Is that what you think this is about? A reference?” Finn’s voice cracked. “Is that not what you did from the start? You brought me here because I had no choice, and I would surrender—”",
    "「你覺得這是關於推薦信嗎？」芬恩的聲音破了。「難道不是嗎？你從一開始就把我弄來這裡，因為我沒得選，我只能屈服——」"
   ],
   [

   [

    "菲利克斯吻了他，唇上還帶著威士忌與雨水，那不是詢問，而是他撐了多年的一切全面崩塌。"
   ]
  ],
  [

    "「我們已經沒有任何工作上的關係了，」芬恩握緊包帶說。「如果你是來找樂子的，右轉有的是酒吧。」「我不是來找樂子的。」菲利克斯撐開一把黑傘走下車。他沒有碰他，只遞出一個牛皮紙袋。"

    "菲利克斯端來兩杯黑咖啡，遞了一杯過去。「因為在都柏林，我活得像一台從出生就上緊發條的機器。我的衣服、學校、妻子與事業，全由家族信託安排好了。然後我看見你把酒潑在一個政客臉上，轉身去擦杯子。我想：這裡有一個人能活得那麼痛、那麼真實，卻依然比坐在董事會裡像傀儡的我強。」"

    "民間故事集夾在法律彙編之間：那是他母親唸給他聽的一套愛爾蘭古老傳說，裡面的海中生物被描繪得既殘酷又善良。「我盡量減少擁有的東西，」菲利克斯說。「我盡量消除浪費，因為我長大的那棟房子裡，每一樣資源都是象徵。這裡我只有一張桌子、兩張椅子和很多紙。」"

    "The room had a clear structure and one odd feature that Finn noticed at once: every book was arranged by the feeling it caused, not by its subject. The contrast with the rigid order of the firm was complete. Despite the rain, Finn’s focus stayed on the man in front of him, and he began to perceive an aspect of Felix that no file had ever shown, his potential for ordinary tenderness.",
    "房間有清楚的結構，以及一個芬恩立刻注意到的奇特之處：每本書都依它帶來的感受排列，而不是依主題。與事務所僵硬的秩序形成完全的對比。儘管下著雨，芬恩的注意力仍集中在眼前的男人身上，他開始察覺到菲利克斯的一個面向，那是任何檔案都未曾顯示的：他對平凡溫柔的潛能。"

    "Felix conducted the conversation as he had once conducted a negotiation, with patience, except that this time he had no strategy, no restriction and no prepared range of options. He could not select the right words, so he chose the true ones. “A survey of my life would show that I participated in nothing I chose. I constructed a career, maintained an expression for thirty years, and ensured that nobody ever saw me afraid. My primary skill is silence.”",
    "菲利克斯進行這場談話，就像他曾進行過的談判，帶著耐心，只是這一次他沒有策略、沒有限制，也沒有準備好的選項範圍。他選不出正確的話，所以選了真實的話。「對我人生做一次調查，會發現我沒有參與過任何自己選擇的事。我打造了事業，維持了三十年的表情，確保沒有人看見我害怕。我最主要的技能是沉默。」"

    "芬恩的手指在溫熱的杯上僵住。他想說點尖銳的話，卻發現喉嚨像被堵住。「我不是在施捨，」菲利克斯說，聲音比芬恩聽過的任何時候都柔和。「我被你吸引了。從頭到尾都是我在靠近，不是你在求我。」"

    "閃電劃過窗戶，雷聲跟著響起。芬恩把杯子放在桌上，上前一步，揪住菲利克斯的衣領。「如果你敢再像個自以為是的資本家一樣替我做決定，」他沙啞地說，「我就告到你破產。」"

    "菲利克斯笑了，那是芬恩在他臉上看過最深的笑。然後他扣住芬恩的後腦，吻了他，那不再是風暴裡的掠奪，而是兩個被階級與現實的縫隙擠壓的人，在雨夜裡找到了彼此的錨。"

 "paras": [
  [
   [
    "The honeymoon did not last. Three days later a solicitor’s letter from Dublin arrived at the dean’s office at University College Cork, with a copy to the Cork branch. The accusations were severe: Felix had leaked commercial secrets, interfered with a regulatory review, and colluded with an outsider, meaning Finn, to damage the family’s interests.",
    "蜜月沒有持續。三天後，一封來自都柏林的律師函送到科克大學院長辦公室，副本抄送科克分所。指控極其嚴厲：菲利克斯洩漏商業機密、干預監管審查，並勾結外人，也就是芬恩，損害家族利益。"
   ],
   [
    "The letter threatened to revoke Felix’s licence and to drag Finn into proceedings under the visa rules. Finn stared at the scanned page in the library study room, his fingers cold. “They want to destroy us. If it reaches the High Court, your licence is gone, and my visa may be cancelled.”",
    "信中威脅要吊銷菲利克斯的執照，並把芬恩牽扯進簽證條例的程序。芬恩在圖書館自習室盯著那頁掃描檔，指尖冰涼。「他們要毀了我們。如果鬧上高等法院，你的執照沒了，我的簽證也可能被取消。」"
   ]
  ],
  [
   [
    "“Do not panic.” Felix’s voice was calm, and his eyes behind the gold glasses were as sharp as a blade. “The old man has stopped sitting still. That means the material we sent to Brussels has hit a vital point. They are not investigating us. They are afraid.”",
    "「別慌。」菲利克斯的聲音很冷靜，金邊眼鏡後的眼神銳利如刀。「老頭子坐不住了。這代表我們送去布魯塞爾的資料打中了要害。他們不是在調查我們，是在害怕。」"

    "He turned the laptop around. A hidden diagram of financial flows filled the screen, a record of shell companies, offshore accounts and illegal asset transfers, built up over years by the family trust. “My mother left it to me. She became ill after she discovered what lay under the trust. My father thought that burying it was enough, but he underestimated how well I keep a backup.”",
    "他把筆電轉過來。螢幕上是一張隱密的資金流向圖，記錄著空殼公司、境外帳戶與非法資產轉移，是家族信託多年累積的結果。「我母親留給我的。她發現信託底下的黑幕後病倒了。我父親以為把它壓下去就好，但他低估了我備份的功夫。」"

    "「從現在起每一步都踩在刀尖上。但如果我們聯手，就不是他們審判我們，而是我們把整個家族翻過來。」芬恩握住他的手。「那就讓他們看看，被他們踩在腳下的人，怎麼把法庭變成葬禮。」"
   ]

    "菲利克斯告訴他還有另一條路：接受家族的提議。但情勢不利於此，而他們開出的可觀金額只會維持舊秩序。法官不願倉促，想看每一頁。「基本權利不是拿來賣的，」他說。「而從法律角度看，法官會對任何私下達成的交易抱持懷疑。」"

    "菲利克斯不會用謊言替自己辯護。他的態度對法庭上的每個人都很明顯，他不預測任何事，也不承諾任何事。結果會引發爭議，而隨後的公眾辯論會削弱家族的聲譽。為增進公眾信任與推動改革，關鍵一步是立即實施新規則，而掩蓋是蓄意的，這就是意圖的重大證據。"

    "都柏林高等法院是一座藍光籠罩的大廳，穹頂鑲著彩繪玻璃。旁聽席座無虛席：財經記者、律師，以及家族的核心成員。一場原本只是內部聽證的案子，因為牽涉跨國能源集團與龐大的逃稅醜聞，演變成年度大案。"

    "一邊站著家族的首席大律師，全國最昂貴的那一位。另一邊是被停職、幾乎孤身一人的菲利克斯，芬恩作為法律助理站在他身旁。「你被控非法取得並揭露家族商業機密，」首席大律師開口，語氣滿是鄙夷。"

    "「我反對，法官大人。」菲利克斯身穿最嚴整的黑色西裝站起，把一份厚厚的文件遞給法警。「這些不是機密。這是跨境洗錢與系統性逃稅的證據。依據歐盟第四與第五號反洗錢指令，任何用來掩蓋非法資產轉移的信託，都不受保密協議保護。」"

 "paras": [
  [
   [
    "Next morning the marble square in front of the High Court in Dublin was already packed with financial reporters and the long lenses of every outlet. The air held the chill of early winter and the tension of a drawn sword.",
    "次日清晨，都柏林高等法院前的大理石廣場早已擠滿財經記者與各家媒體的長鏡頭。空氣中有初冬的寒意，也有拔劍弩張的緊繃。"
   ],
   [
    "When the black car stopped, the flashbulbs went off like daylight. Felix stepped out in a flawless black three-piece suit, his eyes cool and sharp behind the gold frames. Beside him came Finn Mercer, the lead legal assistant, in a sharply cut navy suit, with a straighter back than anyone in the square.",
    "黑色轎車停下時，閃光燈如白晝般亮起。菲利克斯走出車門，身穿無懈可擊的黑色三件套，金框眼鏡後的目光冷靜而銳利。他身旁是首席法律助理芬恩·默瑟，一身剪裁俐落的深藍西裝，背脊比廣場上任何人都挺直。"

   [
    "They climbed the steps side by side, and the reporters, who had been about to surge forward, found themselves making a path.",

   ]
  ],
  [
   [
    "The public gallery was full. The family’s inner circle sat in the front row, every face dark enough to drip. MacDonald was among them, and he did not look at Felix.",
    "旁聽席座無虛席。家族核心成員坐在最前排，每張臉都陰沉得快要滴出水。麥克唐納也在其中，他沒有看菲利克斯。"
   ],
   [
    "The judge struck the gavel. “This court is in session. In the matter of the application by the O’Connor family trust concerning unlawful operations and asset transfers at the Cork branch, the parties will state their arguments.”",
    "法官敲下法槌。「本庭開庭。關於奧康納家族信託對科克分所違法操作與資產轉移的申請一案，請雙方陳述意見。」"

 "paras": [
  [
   [
    "In the middle of May the great hall of University College Cork was filled with the smell of old wood and the low murmur of gowns. Finn Mercer sat alone at a table in the centre of the room, in a navy suit that Maeve had pronounced acceptable, and tried not to look as nervous as he felt.",
    "五月中旬，科克大學的大禮堂裡瀰漫著舊木頭的氣味與長袍窸窣的低語。芬恩·默瑟獨自坐在大廳中央的一張桌子旁，穿著梅芙評為可以接受的海軍藍西裝，努力不讓自己看起來像心裡那麼緊張。"

    "他的論文題目是《碼頭上的自動化：港口技術如何重塑區域不平等》。他在圖書館、地下酒吧和溫室辦公室的凌晨時分寫出它，現在他有四十分鐘為每一頁辯護。"

    "他從假設開始，接著講到證據。當失業數字的投影片出現在螢幕上，他的緊張消失了，每次面對數字時都是這樣。他說明自動化與低技術工作流失之間的相關性、基礎建設投資如何流向城市而繞過港口小鎮，以及預測哪些社區將是下一批的模型。"

    "那是他早就準備好的問題。「來自我曾工作過的一間顧問公司的科克分所，法官大人，我是說，先生。」笑聲在室內掠過，芬恩感到耳朵發燙。「每個數字都已匿名化，經大學倫理委員會核准，並取得客戶同意。方法論附錄列出了核准的每一個步驟。否則我一個數字都不會用。」"

    "旁聽席最後一排，一位穿炭灰色大衣的男人雙手交疊放在膝上。四十分鐘裡，他一動也沒動。他清空了整個下午，取消了與鹿特丹的通話，旁邊的座位上放著一束用牛皮紙包著、像祕密一樣的白色鬱金香。"

    "By June the firm had a waiting list. The greenhouse had become so busy that Maeve hired two analysts and a very serious intern named Orla, and the sign on the door no longer looked like a miracle. It looked like a business.",

 "paras": [

    "The Raven was exactly as he had left it: low ceiling, bad lighting, a smell of old wood, whiskey and warmth. Liam looked up from the till when Finn came through the cellar door with a bag over his shoulder, and said, without a word of greeting, “Third stool from the end, you eejit. I knew you would be back.”",
    "烏鴉酒吧和他離開時一模一樣：低矮的天花板、昏暗的燈光，帶著舊木頭、威士忌與暖意的氣味。當芬恩肩上掛著袋子走進地窖門，連恩從收銀機後抬起頭，連招呼都沒打，就說：「從最後數第三張凳子，笨蛋。我就知道你會回來。」"

    "Finn picked it up and went out through the back, into the lane where the wet stones shone under a single lamp. “Mam,” he said.",

    "銀行憑公司的帳目與芬恩的模型核給了房貸，一位核保員略帶惆悵地形容那是愛爾蘭唯一一套曾替自己平衡過帳目的合規系統。他們在九月某個星期二簽約，在藥房樓上的一間小辦公室，梅芙當見證人，希利先生像在洗禮上的祖父一樣笑得合不攏嘴。"

    "There was no bed frame yet, only a mattress on the floor of the big room that looked over the river, and a lamp balanced on a stack of law reports. The boxes made a small city around them. Someone had forgotten to unpack the curtains, so the window stayed bare, and the lights of the far bank lay on the ceiling like scattered coins.",

   [
    "The call came to the office at seven in the morning on the following Friday. Maeve, who answered it, put her hand over the receiver and said, in the tone that she reserved for emergencies, “It is Brussels. The Commission, the maritime affairs directorate. A Mr Verbeke. He would like to speak to Finn.”",

 "next": "一通來自都柏林的電話，讓婚事暫時擱了下來。",
 "paras": [
  [
   [
    "They flew home on a Thursday, and on the following Saturday, at the end of a long day of negotiation with a Kinsale seafood exporter, Felix said that he wished to show Finn something and drove him, without explanation, to the harbour. He parked above a stone terrace that nobody used in autumn. Below it the Atlantic was turning the colour of a plum.",
    "他們星期四飛回家，接下來那個星期六，在與一家金塞爾海鮮出口商談判了漫長的一天之後，菲利克斯說他想讓芬恩看樣東西，沒有解釋，就開車載他到港口。他把車停在一座秋天沒有人用的石砌露台上方。下方，大西洋正轉成李子的顏色。"

   ]

   [

   ],
   [
    "Inside lay a plain platinum band with no diamond at all. Around its edge ran a single engraved line, so fine that it could be seen only in the right light, and Finn, who read data for a living, understood at once that it was a shipping route: Cork to Vigo to Brussels and home again.",
    "裡面是一枚沒有任何鑽石的素面鉑金戒指。邊緣有一條細到只有在對的光線下才看得見的刻線，而以讀數據為生的芬恩，立刻明白那是一條航線：科克、維哥、布魯塞爾，然後回家。"
   ],
   [
    "“Finn Mercer,” said Felix, and his voice was low and clear. “I have signed contracts worth millions, and read ten thousand pages of regulation. Of all of them, this is the only clause that I did not need to think about. I am asking you, not telling you. Will you marry me?”",
    "「芬恩·默瑟，」菲利克斯說，聲音低沉而清晰。「我簽過價值數百萬的合約，讀過上萬頁的法規。在所有條款裡，只有這一條，我完全不需要思考。我是在問你，不是在告訴你。你願意嫁給我嗎？」"
   ]
  ],
  [
   [

 "paras": [

   ]

 "paras": [

    "Desmond O’Connor lay propped on three pillows in a private room on the fourth floor, one side of his face slack and the other side still furious. He had been a tall man. The illness had folded him like a letter. When Felix came in he turned his eyes, and the good half of his mouth made a shape that took a long time to become a word.",

    "“And the old firms in Frankfurt and Paris will sell them a very expensive, very opaque certificate.” Finn put down his cup. “I want to build the opposite. A public ledger. Open source. Anybody can audit it, nobody can buy a better result. If a small shipper in Kinsale can prove his emissions as cheaply as a giant in Rotterdam, the walls come down.”",
    "「而法蘭克福與巴黎的老牌事務所，會賣給他們一張非常昂貴、非常不透明的證書。」芬恩放下杯子。「我想打造相反的東西。一本公開的帳冊。開源。任何人都能稽核，沒有人能買到更好的結果。如果金塞爾的小貨運商能和鹿特丹的巨頭一樣便宜地證明自己的排放，那麼高牆就會倒下。」"

    "The letter was in three languages and bore the signature of a Commissioner. It invited Mercer & O’Connor, as independent experts on cross-border compliance, to give evidence at a closed hearing before a committee of the European Parliament in the second week of July. The subject was the enforcement of the new Directive. The witnesses would include the chief counsel of every major energy group in Europe.",

    "「這也是個陷阱，」菲利克斯說。「我家的姓在那棟建築裡不受歡迎。他們有一半認識我父親。另一半讀過報紙。如果我坐在你身旁，每一個記者都會寫繼承人與醜聞，而不是寫帳冊。」"

    "這是芬恩在許多個月裡、以一百種細微的方式，等著聽到的問題。他沿著摺痕非常小心地折起信。「我要你坐在第一排，」他說。「不是我旁邊，不是我後面。在第一排，我看得見你的地方。醜聞不是你需要隱藏的東西。那是你已經熬過的東西。讓他們看。讓他們看我們。」"

    "菲利克斯照他承諾的坐在第一排。幾個人轉過頭。一位戴珍珠項鍊的女士對鄰座低語。他交疊腳踝，直視前方，帶著一個待過糟糕得多的房間的人那種從容。"

    "「主席、各位尊敬的議員。」他的聲音完全平穩。「這個房間裡的每一家公司都被告知，新指令會讓供應鏈更乾淨。我想告訴你們它實際上會讓供應鏈變成什麼樣。除非證明是公開的，否則它會讓小公司更昂貴，讓大公司更獲利。」"

 "paras": [
  [
   [
    "The tea break was held in a glass atrium full of potted palms and low conversation. Finn was surrounded at once by a knot of admirers, two Swedish legal scholars and a young Dutch official who wanted to know whether the ledger could handle shipping containers. He was in the middle of a sentence when he heard a voice behind him, smooth as oil and sharp as a razor.",
    "茶歇在一座滿是盆栽棕櫚與低語的玻璃中庭裡舉行。芬恩立刻被一群仰慕者包圍，兩位瑞典法學者，和一位想知道帳冊能不能處理貨櫃的年輕荷蘭官員。他正說到一半，聽見背後一個聲音，像油一樣滑，像剃刀一樣利。"
   ],
   [
    "“A charming demonstration, Mr Mercer. But you have spent too long in Cork, I think. The world is not as simple as an open-source diagram.”",
    "「一場迷人的示範，默瑟先生。不過我想你在科克待太久了。世界不像開源圖表那麼簡單。」"
   ]
  ],
  [
   [
    "The speaker was Monsieur Lefèvre, the chief counsel of Verdane Energy, a large silver-haired man with a silk handkerchief and a smile that did not reach the upper half of his face. Four assistants hovered behind him. The Swedes drifted away.",
    "說話的人是勒菲弗先生，韋爾丹能源的首席法律顧問，一位銀髮、有絲質手帕的壯碩男人，笑容觸及不到臉的上半部。四位助理在他身後徘徊。瑞典人悄悄走開了。"
   ],
   [
    "Finn turned round with an expression of interest. “Which part is too simple, Monsieur? I would be glad to hear. The eleven gaps in your Estonian carbon-capture projects, perhaps? The independent inspectors found that thirty per cent of the readings were fabricated. I should be grateful if you could explain how a diagram of that is simple.”",
    "芬恩帶著感興趣的神情轉過身。「哪個部分太簡單，先生？我很樂意聽。或許是貴公司愛沙尼亞碳捕集專案裡的十一處缺口？獨立查核員發現，百分之三十的讀數是捏造的。如果您能解釋一張關於那個的圖表為何簡單，我會很感激。」"
   ],
   [
    "The smile on Lefèvre’s face stayed where it was. Only the eyes changed. He stepped a little closer, and lowered his voice to a register that no microphone could catch.",
    "勒菲弗臉上的笑容留在原處。只有眼睛變了。他靠近一點，把聲音壓低到任何麥克風都收不到的音階。"
   ]
  ],
  [
   [
    "“A database is a fragile thing, young man,” he said softly. “Servers burn. Companies are bought. Reputations, too, can be bought, or sold, or mislaid. Be careful where you carry your laptop.”",
    "「資料庫是很脆弱的東西，年輕人，」他輕聲說。「伺服器會燒毀。公司會被買下。名聲，同樣也可以被買、被賣，或被遺失。小心你把筆電帶到哪裡。」"
   ],
   [
    "A warm hand came to rest at the small of Finn’s back. Felix had crossed the atrium without a sound. He did not say a word. He looked at Finn, and Finn, who had learned in four hundred small moments to read that grey gaze, understood that he was being asked a question: Shall I?",
    "一隻溫熱的手落在芬恩的後腰。菲利克斯無聲地穿過了中庭。他一句話也沒說。他看著芬恩，而在四百個小片刻中學會讀這道灰色目光的芬恩，明白自己被問了一個問題：我可以嗎？"
   ],
   [
    "Finn gave the smallest shake of his head. Then he turned back to the big man and said pleasantly, “Thank you for the advice, Monsieur. I will tell you something in return. Every server that holds our ledger has a copy in eleven countries, and each of those copies is held by someone who has no idea that you exist. You cannot burn it. You can only read it.”",
    "芬恩輕輕搖了一下頭。然後他轉回去面對那個大個子，和氣地說：「謝謝您的忠告，先生。我也回報您一件事。每一台存放我們帳冊的伺服器，在十一個國家都有備份，而每一份都由完全不知道您存在的人保管。您燒不掉它。您只能閱讀它。」"
   ]
  ],

    "勒菲弗看著他們兩人，一個穿著好西裝而擁有借來的自信的瘦削年輕人，以及他肩旁那位高大沉默的律師。他拿出絲質手帕輕觸嘴唇，一言不發地走開。他的助理們排成整齊、匆忙的一列跟上。"

 "id": 55,

 "title": "A Message from London",
 "zh": "倫敦來的訊息",
 "recap": "勒菲弗的威脅沒有嚇退芬恩，因為他知道菲利克斯會先問。",

 "paras": [
  [
   [
    "The email arrived on the night they returned to Cork. It was encrypted, unsigned, and carried a subject line that read only: Not for the office. Felix, who was brushing his teeth, came out of the bathroom with foam on his chin when Finn said his name.",
    "那封電子郵件在他們回到科克的當晚抵達。它加了密、沒有署名，主旨只寫著：不要在辦公室看。正在刷牙的菲利克斯，在芬恩叫他名字時，下巴還帶著泡沫走出浴室。"
   ],
   [
    "The sender was Inspector Thomas Whitlock of the Financial Conduct Authority in London, an old schoolmate of Felix’s whom he had not spoken to in a decade. The message was brief. It said that a new hedge fund, Aegis Capital, had begun buying options on the companies that had lost most at the Brussels hearing, and that its financiers were former members of the O’Connor Family Fund board, the same men who had resigned in disgrace in the autumn.",
    "寄件人是倫敦金融行為監管局的湯瑪斯·惠特洛克督察，菲利克斯一位十年沒說過話的老同學。訊息很簡短。它說，一家新的對沖基金「宙斯盾資本」已開始購買那些在布魯塞爾聽證會中損失最多的公司的選擇權，而其出資者是歐康納家族基金董事會的前成員，也就是去年秋天蒙羞辭職的那批人。"
   ]
  ],
  [
   [
    "“They are going to attack the ledger,” said Finn quietly. He had stopped being angry and begun, as he always did, to think. “Not directly. They will try to buy the company that hosts our servers in Dublin, and then claim that they own the data by default. It is a pure paper manoeuvre. It would take them about two weeks.”",
    "「他們要攻擊帳冊，」芬恩安靜地說。他已不再生氣，而是像往常一樣開始思考。「不是直接。他們會試圖買下我們在都柏林的伺服器代管公司，然後主張他們理所當然擁有數據。純粹是紙上操作。大約需要兩個星期。」"
   ],
   [
    "“And the date on which they would complete it?”",
    "「他們完成的日期呢？」"
   ],
   [
    "“If they have moved already, nine days.”",
    "「如果他們已經行動了，九天。」"
   ]
  ],
  [
   [
    "At three in the morning, the alarm that Finn had built into his own laptop began to chirp. It was a small, polite, relentless sound, like a bird. He was out of bed before Felix was awake, and by the time Felix reached the kitchen, the lights were on and Finn, in his pyjamas and glasses, was typing at a speed that blurred his hands.",
    "凌晨三點，芬恩內建在自己筆電裡的警報器開始啁啾。那是一種小小的、有禮貌的、持續不斷的聲音，像一隻鳥。他在菲利克斯醒來前就已下床，等菲利克斯走到廚房時，燈已經亮了，穿著睡衣戴著眼鏡的芬恩，打字速度快到手都模糊了。"

   [
    "“Someone is knocking on the front door of the ledger,” he said, without looking up. “Two hundred attempts a second, from eleven different countries. It is a crude attack. They want to find out how fast I respond.”",
    "「有人在敲帳冊的大門，」他頭也不抬地說。「每秒兩百次，來自十一個不同國家。這是個粗糙的攻擊。他們想知道我反應有多快。」"
   ],
   [

 "name": "The City",
 "band": "8.0",
 "title": "The City",
 "zh": "金融城的三天",
 "recap": "凌晨的攻擊被擋了下來，芬恩決定親自去倫敦拿走對手的執照。",
 "next": "天色暗下來，泰晤士河上亮起了燈。",
 "paras": [
  [
   [
    "London in July was hot and loud and smelt of diesel and cut grass. They took rooms in a small hotel at Bankside, within sight of the river, and on the first morning Finn laid out his evidence on the bed in neat rows like a man dealing cards: share registers, option contracts, a chain of eleven shell companies that began on the Isle of Man and ended in the pockets of six men who had once sat on the board of the O’Connor Family Fund.",
    "七月的倫敦又熱又吵，聞起來有柴油與剛割過的草的味道。他們在河岸區一間小旅館訂了房，看得見河，第一天早上，芬恩把證據整齊排列在床上，像發牌的人：股東名冊、選擇權合約，以及一條由十一家空殼公司組成的鏈，起點在曼島，終點在六個曾坐在歐康納家族基金董事會的男人的口袋裡。"
   ],
   [
    "“How long have you had all this?” asked Felix, staring.",
    "「這些你收集多久了？」菲利克斯瞪著問。"
   ],
   [
    "“Forty-eight hours,” said Finn. “Their filings are public. They simply never imagined that anyone would read them.”",
    "「四十八小時，」芬恩說。「他們的備案是公開的。他們只是從沒想過有人會讀。」"
   ]
  ],
  [
   [
    "Inspector Whitlock met them in a café behind Southwark Cathedral. He was a thin, tired man with a briefcase held together by string, and he read Finn’s file in twenty minutes without saying a word. When he looked up, he had the face of a man who had been waiting a long time for a present.",
    "惠特洛克督察在南華克大教堂後面的一間咖啡館與他們碰面。他是個瘦削疲倦的男人，公事包用繩子綁著，二十分鐘內不發一語地讀完芬恩的檔案。他抬起頭時，臉上是一個等一份禮物等了很久的人的表情。"
   ],
   [
    "“This is market manipulation, insider dealing and money laundering in a single bundle,” he said. “I could take it to the Authority this afternoon. But I should warn you. The moment I do, they will know. Men like these do not go quietly.”",
    "「這是市場操縱、內線交易與洗錢的合併包裹，」他說。「我今天下午就能把它帶去監管局。但我得警告你們。一旦我這麼做，他們就會知道。這種人不會安靜地走。」"
   ]
  ],
  [
   [
    "He was right. The next morning, as Felix stood alone in the hotel lift on his way down to breakfast, the doors opened on the second floor and a man in an expensive suit stepped in and pressed the button for the ground. It was Aegis’s chairman, the one with the soft hands and the tennis tan, a man who had once toasted Felix’s christening.",
    "他說得對。第二天早上，菲利克斯獨自站在旅館電梯裡下樓用早餐，電梯門在二樓開啟，一個穿昂貴西裝的男人走進來，按了一樓。他是宙斯盾的董事長，手很柔軟、有網球曬痕，曾經在菲利克斯的洗禮上舉杯祝賀。"
   ],
   [
    "“Felix.” The man smiled, genial and sorrowful. “What a waste. You have your father’s head and a stranger’s heart. Come back. We will forget the folder, the newspapers, the whole unfortunate business. The fund will be yours. All of it. You need only leave the Irish boy and his little toy.”",
    "「菲利克斯。」那人微笑，親切而哀傷。「多麼浪費。你有你父親的腦袋和陌生人的心。回來吧。我們會忘記那份資料夾、那些報紙，整個不幸的事件。基金會是你的。全部。你只需要離開那個愛爾蘭男孩和他的小玩具。」"
   ],
   [
    "Felix looked at the numbers rising above the door. He thought of the key in his pocket, and the veto deed, and a mattress on a bare floor. When he answered, he did not raise his voice.",
    "菲利克斯看著門上方上升的數字。他想到口袋裡的鑰匙、否決權契約，以及光地板上的一張床墊。當他回答時，沒有提高聲音。"
   ],
   [
    "“I cannot answer that question without my husband,” he said. “Neither could you, if you had one. Good morning.”",
    "「沒有我丈夫，我無法回答這個問題，」他說。「如果你有的話，你也不能。早安。」"
   ]
  ],
  [
   [
    "At three o’clock that afternoon, the Financial Conduct Authority issued an emergency notice. All accounts of Aegis Capital were frozen. Six named individuals were prohibited from leaving the country. By four, the London Stock Exchange had suspended trading in every company whose options the fund had touched.",
    "那天下午三點，金融行為監管局發布緊急通知。宙斯盾資本的所有帳戶遭到凍結。六名具名人士被禁止出境。到四點，倫敦證券交易所暫停了該基金觸及的每一家公司的交易。"
   ],
   [
    "Finn heard it on the radio in a taxi, with his laptop on his knees. He did not whoop. He closed his eyes, breathed out, and put his head down on the shoulder of the man who was sitting beside him in the back seat, and Felix, who was in the habit of reading him, understood, and put an arm around him in full view of the cabbie, and said nothing at all.",
    "芬恩在計程車上、筆電擱在膝蓋時，從廣播裡聽到了。他沒有歡呼。他閉上眼睛、吐出一口氣，把頭靠在坐在後座身旁的男人肩上，而習慣讀他的菲利克斯明白了，當著司機的面抱住他，什麼也沒說。"
   ]
  ]

{
 "id": 57,
 "name": "Thames at Night",
 "band": "7.0",
 "title": "Thames at Night",
 "zh": "泰晤士河的夜",
 "recap": "宙斯盾資本在下午三點被凍結，菲利克斯拒絕了一個價值整座基金的提議。",
 "next": "回到科克，一鍋湯在爐子上等著他們。",
 "paras": [
  [
   [
    "That evening the sky over the Thames turned a rich, bruised violet, and Tower Bridge lit up in the distance like a toy made for giants. Finn stood at the hotel window with a glass of whisky in his hand, looking at the glittering and indifferent City and feeling the day’s adrenalin leave his body like a tide going out.",
    "那天傍晚，泰晤士河上的天空轉成濃重、帶瘀青的紫，遠處的塔橋像為巨人做的玩具般亮起。芬恩站在旅館窗前，手裡拿著一杯威士忌，望著閃爍而冷漠的金融城，感覺這一天的腎上腺素像退潮般離開身體。"
   ],
   [
    "A warm body came up behind him. The woody scent that he had learned to recognise in the dark reached him before the arms did, and then Felix’s chin was resting on his shoulder.",
    "一具溫暖的身體從後方貼上來。他在黑暗中學會辨認的木質香氣，比手臂更早到達，然後菲利克斯的下巴擱在他的肩上。"
   ]
  ],
  [
   [
    "“It is finished?” murmured Felix.",
    "「結束了嗎？」菲利克斯低喃。"
   ],
   [
    "“Aegis is bankrupt, the shareholders are barred, and the ledger belongs to everyone, which is to say nobody can steal it.” Finn took a sip. “I am told that is what winning feels like. I mainly feel hungry.”",
    "「宙斯盾破產了，股東被禁止，帳冊屬於所有人，也就是說沒人能偷走它。」芬恩啜了一口。「聽說這就是贏的感覺。我主要覺得餓。」"
   ],
   [
    "Felix laughed against his neck. Then he turned him round, gently, so that the lights of the river were behind Finn’s head like a halo, and looked at him for a long moment with the grey eyes gone dark and serious. “When I met you in the rain, I thought that I was rescuing a cold student from a bad night. It was the other way round. You came into my life and broke every chain I had.”",
    "菲利克斯對著他的脖子笑起來。然後他輕輕把他轉過來，讓河上的燈光在芬恩頭後像光環一般，用變得暗沉而認真的灰色眼睛看了他好一會兒。「在雨中遇見你時，我以為我是在把一個冷壞了的學生從糟糕的夜晚中救出來。其實是反過來。你走進我的生命，打斷了我所有的鎖鏈。」"
   ],
   [
    "“Only now do you see that?” Finn put down the glass, slid both arms round his neck, and lifted an eyebrow. “My fees are very high, Mr O’Connor. You have signed a contract for life. Are you quite certain that you can pay?”",
    "「現在才看出來？」芬恩放下杯子，雙臂環住他的脖子，挑起一道眉毛。「我的費用很高，歐康納先生。你簽了一份終身合約。你確定付得起嗎？」"
   ]
  ],
  [
   [
    "“I will pay with everything I have,” said Felix. “My name, which is worth little, my money, which is worth less, and the rest of my years, which I am told are the only currency you accept.”",
    "「我會用我擁有的一切來付，」菲利克斯說。「我的名字，不值什麼；我的錢，更不值；還有我餘生的歲月，聽說那是你唯一接受的貨幣。」"
   ],
   [
    "He kissed him then, and there was no one in the world to see it but the river. It began slowly, with the unhurried certainty of two people who had every night ahead of them, and it deepened. The curtains were left open, and then at some point were not. Buttons gave way, and then a clasp, and laughter, and a soft muffled word from Finn that was nearly a plea.",

    "Cork was cool and grey when they returned, with a thin rain falling on the river and the gulls complaining on the roofs. They carried their bags up the steps of the Victorian house, and Felix put his key in the door, and Finn put his hand over his and said, “Wait.” He leaned in, listened, and sniffed. “Someone has been in our kitchen.”",

    "In the autumn, the University College Cork Faculty of Law invited Finn Mercer to give the Founders’ Day address as a distinguished alumnus. The invitation came on thick cream paper, which he found funny, because four years earlier the same Faculty had made him wait three weeks for a decision on a hardship grant. He pinned it to the refrigerator with a magnet shaped like a lobster.",

    "一陣驚訝的漣漪穿過大廳。他等它平息。「我有一件好外套，沒有錢。我坐在後排，因為我為自己的鞋子感到羞愧。我以為法律是別人說的語言，用另一種口音，在我沒被邀請進入的房間裡。然後我的一位講師對我說：『默瑟先生，法律屬於任何仔細閱讀它的人。』」"

 "recap": "熱浪過後，奧拉的作文拿到了高分，教授布倫南邀請芬恩去母校演講。",

 "paras": [
  [
   [
    "Professor Brennan had a proposal, and she delivered it in her usual manner, by announcing it as a fact. The faculty was launching a free evening programme for adults who had left school early, and she wanted Finn to give the opening lecture on the following Thursday.",
    "布倫南教授有個提案，而她以慣常的方式，把它當成既定事實宣布出來。學院要為早年輟學的成人開設免費夜間課程，她希望芬恩在下週四發表開幕演講。"
   ],
   [
    "“Why me?” asked Finn, on the phone, with his thumb on the corner of the napkin that lived permanently in his wallet.",
    "「為什麼是我？」芬恩在電話裡問，拇指按著永遠放在他錢包裡的那張餐巾紙的一角。"
   ],
   [
    "“Because you are the only graduate I know who was told that he did not belong, and who proved the department wrong,” said the professor. “Do not be modest, Mr Mercer. It does not suit you.”",
    "「因為你是我所知唯一被人說不屬於這裡、卻證明系上錯了的畢業生，」教授說。「別謙虛，默瑟先生。那不適合你。」"
   ]
  ],
  [
   [
    "The hall was full. Nuala Mercer sat in the front row with her handbag on her knees, and beside her sat a retired bus driver, two nurses who worked night shifts, and a young father with a toddler asleep on his shoulder. None of them had been inside a lecture theatre before.",
    "大廳坐滿了。努阿拉·默瑟坐在第一排，手提包放在膝上，旁邊坐著一位退休公車司機、兩位上夜班的護理師，以及一位肩上趴著熟睡幼兒的年輕父親。他們沒有一個人進過階梯教室。"
   ],
   [
    "Finn began by asking a question. “How many of you were told, at school, that you were not academic?” Nearly every hand rose. “Good,” he said. “So was I. That was the first thing we have in common. The second is that the people who said it were wrong.”",
    "芬恩從一個問題開始。「你們有多少人在學校被告知自己不是讀書的料？」幾乎每一隻手都舉了起來。「很好，」他說。「我也是。這是我們的第一個共同點。第二個是，說這句話的人錯了。」"
   ]
  ],
  [
   [
    "He spoke for twenty minutes about the difference between ability and opportunity. He said that a child’s performance depended less on intelligence than on whether there was a quiet room to study in, a meal at the right time and a parent who had the energy to ask how the day had gone. He said that a university degree was not a measure of talent, but a record of who had been given support.",
    "他講了二十分鐘能力與機會的差別。他說，孩子的表現，與其說取決於智力，不如說取決於有沒有安靜的房間可以念書、是否在對的時間吃到飯，以及家長有沒有力氣問一句今天過得如何。他說，大學學位不是才能的衡量，而是誰曾被給予支持的紀錄。"
   ],
   [
    "During questions, the retired bus driver stood up. “Is it not too late for me?” he asked. “I am sixty-one.”",

   ],
   [
    "“My mother started a diploma at fifty-four,” said Finn, and found her face in the front row. “She has not told you this, but she is the one who made me read the small print on everything. Learning has no deadline. It only has a first day.”",

 "paras": [
  [
   [
    "The argument started over dinner, which was usually where the good ones did. Finn had been invited to advise a regional bank that wanted to use artificial intelligence to approve loans in thirty seconds, and he was explaining how the model would work when Felix put down his fork.",
    "爭論從晚餐時開始，好的爭論通常都是這樣。芬恩受邀為一家地區銀行提供諮詢，對方想用人工智慧在三十秒內核准貸款，他正在解釋模型怎麼運作時，菲利克斯放下了叉子。"

   ]

  [

    "「銀行負責，」芬恩說。「這就是把它寫進合約的意義。而且模型不是魔法。人類放款專員也會犯錯，也有偏見，事後沒有人能檢查他的推理。模型可以被稽核。一個人的偏見不行。」"

   [
    "“Same table,” said Felix, sliding into the seat that faced the door, the seat that had once been his watching post. “Do you remember what you said to me?”",

   ],

    "“I said that you were in my light,” answered Finn, grinning. “Not the most promising start.”",

    "「那是別人對我說過的最棒的一句話。」菲利克斯從內袋掏出一枚戒指，但不是那一枚。是一枚素面鋼環，磨損而薄，是芬恩在他們決定留下的那晚，在一間廉價小店買給他的。「我把這個放在皮夾裡十年了。」"

 "paras": [
  [
   [
    "At six on a cold January morning the river path was empty except for the two of them and a heron standing like a grey question mark in the shallows. Frost whitened the grass, and their breath rose in short, steady clouds.",
    "一月一個寒冷的早晨六點，河邊小徑除了他們兩人，只有一隻蒼鷺像灰色問號般站在淺灘。霜把草地染白，他們的呼吸化成短而規律的白霧升起。"
   ],
   [
    "“You are slowing down,” said Finn, who was ten paces ahead and not even breathing hard.",
    "「你慢下來了，」領先十步、連氣都沒喘的芬恩說。"
   ],
   [
    "“I am pacing myself,” panted Felix. “It is called strategy.”",
    "「我在調整配速，」菲利克斯喘著氣說。「這叫策略。」"
   ]
  ],
  [
   [
    "Finn laughed and doubled back, running backwards in front of him with the infuriating ease of a man ten years younger. He had taken up running in his first month at the firm, to burn off nerves, and had never stopped. Felix had joined him out of a stubborn wish to be wherever Finn was.",
    "芬恩笑著折返，在他面前倒著跑，輕鬆得令人惱火，像年輕了十歲。他進事務所的第一個月就開始跑步，用來消耗緊張，從未間斷。菲利克斯則出於一種固執的心願加入，只想待在芬恩所在的任何地方。"
   ],
   [
    "At the bridge, the sun finally cleared the rooftops and set the whole river on fire, copper and gold and rose, and both men stopped without a word to watch it.",
    "到了橋邊，太陽終於越過屋頂，把整條河點燃，銅色、金色與玫瑰色，兩人不約而同停下，一言不發地看著。"
   ]
  ],
  [
   [
    "“I used to think that mornings were for the weak,” said Felix, bent over with his hands on his knees. “At the old house my day began with an agenda, and ended with someone’s unhappiness.”",
    "「我以前認為早晨是給弱者的，」菲利克斯彎著腰，雙手撐在膝上說。「在老宅，我的一天以議程開始，以某個人的不快樂結束。」"
   ],
   [
    "“And now?”",
    "「現在呢？」"
   ],
   [
    "“Now it begins with a heron.” He straightened, breathless and shining, and took Finn’s cold hand. “Race you to the café. Loser buys the coffee.”",
    "「現在以一隻蒼鷺開始。」他直起身，氣喘吁吁卻容光煥發，握住芬恩冰涼的手。「比賽誰先到咖啡館。輸的人請客。」"
   ],
   [
    "He lost. He bought the coffee. He did not seem to mind in the least.",
    "他輸了。他請了咖啡。他看起來一點也不在意。"
   ]

/* ---------- prepare data ---------- */
const PASS_MARK = 4;
STORIES.forEach(st => {
  st.s = []; st.zs = [];
  st.paras.forEach(p => p.forEach(pr => { st.s.push(pr[0]); st.zs.push(pr[1]); }));
  st.words = st.s.join(" ").split(/\s+/).length;
  const all = [];
  st.map = {};
  st.vocab.forEach((v, i) => {
    v.sid = st.id; v.i = i; v.key = st.id + ":" + v.w;
    const forms = v.f || [v.w];
    forms.forEach(f => { all.push(f); st.map[f.toLowerCase()] = i; });
    for (let k = 0; k < st.s.length; k++) {
      const m = st.s[k].match(new RegExp("\\b(" + forms.join("|") + ")\\b", "i"));
      if (m) { v.si = k; v.used = m[1]; break; }
    }
  });
  all.sort((a, b) => b.length - a.length);

const synth = ("speechSynthesis" in window) ? window.speechSynthesis : null;

  gbVoice = null;
  for (const n of pref) { const f = gb.find(v => v.name.includes(n)); if (f) { gbVoice = f; break; } }

function route() {
  const h = location.hash.slice(1); let m;
  if (h === "review") return { v: "review" };
  if (h === "notes") return { v: "notes" };
  if (h === "progress") return { v: "progress" };
  if (h === "home" || h === "") return { v: "home" };
  if (h === "bank") return { v: "bank" };

const TOPICS = { env: "環境 Environment", tech: "科技 Technology", edu: "教育 Education", health: "健康 Health", society: "社會 Society", work: "職場 Work", economy: "經濟 Economy", gov: "政府法律 Government", culture: "文化媒體 Culture", science: "科學 Science", urban: "城市旅遊 Urban & Travel", gen: "學術通用 Academic", law: "法律 Law", trade: "國際貿易 International Trade" };

function cards() {

  const sw = new Set(); a.forEach(x => sw.add(x.w.toLowerCase()));
  BANK.forEach(b => sw.has(b.w.toLowerCase()) || a.push({ key: b.key, w: b.w, pos: b.p, zh: b.z, ex: b.e, exz: b.ez, u: b.u, src: TOPICS[b.c].split(" ")[0], ipa: b.i }));
  return a;
}
function dayState() {
  const t = todayN(); if (!S.daily || S.daily.d !== t) S.daily = { d: t, n: 0, extra: 0 };
  return S.daily;
}
function srsStats() {
  const t = todayN(), c = cards(); let due = 0, fresh = 0, learned = 0, mastered = 0;
  c.forEach(x => { const r = S.srs[x.key]; if (!r) fresh++; else { learned++; if (r.b >= 4) mastered++; if (r.due <= t) due++; } });
  const D = dayState(), room = Math.max(0, NEW_PER_DAY + D.extra - D.n);

}

  const t = todayN(), c = cards(), D = dayState();

  const room = Math.max(0, NEW_PER_DAY + D.extra - D.n);
  const fresh = c.filter(x => !S.srs[x.key]).slice(0, room);
  const q = due.concat(fresh).map(x => x.key);

}
const cardByKey = k => cards().find(x => x.key === k);
function grade(key, ok) {

  Q.seen[key] = true;
  if (!r) dayState().n++;

function lev1(a, b) {
  if (a === b) return 0; if (Math.abs(a.length - b.length) > 1) return 2;

  const mode = t.closest("[data-mode]"); if (mode) { ui.rv.mode = mode.dataset.mode; if (ui.q) { ui.q.opts = null; ui.q.typed = null; ui.q.pick = null; ui.q.flip = false; } render(false); return; }

  const bo = t.closest("[data-bo]"); if (bo) { const id = +bo.dataset.bo; ui.bo = ui.bo === id ? null : id; render(false); if (ui.bo) sayOnce(BANK[id - 1].w); return; }

  else if (act === "sharecard") openShare(null);
  else if (act === "backup") openBackup();
  else if (act === "copycode") { const t = $("#bkcode"); t.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e) {} try { navigator.clipboard.writeText(t.value); ok = true; } catch (e) {} toast(ok ? "備份碼已複製" : "請長按文字框選取後複製"); }
  else if (act === "dlbackup") { try { const bl = new Blob([backupCode()], { type: "text/plain" }), u = URL.createObjectURL(bl), l = document.createElement("a"); l.href = u; l.download = "after-hours-backup-" + new Date().toISOString().slice(0, 10) + ".txt"; document.body.appendChild(l); l.click(); l.remove(); toast("已嘗試下載；若沒有出現檔案，請改用複製備份碼"); } catch (e) { toast("這個瀏覽器無法下載，請改用複製備份碼"); } }

  else if (act === "pickfile") { const f = $("#impfile"); if (f) f.click(); }
  else if (act === "sharequiz") openShare({ st: STORIES[r.id - 1], score: ui.quiz.score });
  else if (act === "doshare") doShare();
  else if (act === "sharesite") { try { if (navigator.share) navigator.share({ title: "Flow & Freight", text: "看故事背雅思單字", url: location.href }); else { navigator.clipboard.writeText(location.href); toast("網址已複製"); } } catch (e) {} }
  else if (act === "playall") { const st = STORIES[r.id - 1]; if (ui.playing) stopSpeech(); else playSentences(st, 0, st.s.length - 1); }
  else if (act === "togglezh") { ui.zh = !ui.zh; render(false); }

    const st = STORIES[r.id - 1], Q = ui.quiz; const ans = [];
    for (let i = 0; i < st.quiz.length; i++) { const c = document.querySelector('input[name="q' + i + '"]:checked'); if (!c) { $("#qmsg").textContent = "還有題目沒作答，請完成全部 " + st.quiz.length + " 題。"; return; } ans.push(+c.value); }
    Q.ans = ans; Q.score = ans.filter((x, i) => x === st.quiz[i].a).length; Q.done = true;
    if (Q.score >= PASS_MARK) { S.passed[st.id] = true; save(); } touchDay();

  }

  else if (act === "spellgo") { spellCheck(); }
  else if (act === "spellnext" || act === "clnext") { advance(); render(false); }

    else { ui.resetArm = false; S = { passed: {}, known: {}, srs: {}, daily: null, days: {}, notes: {} }; save(); ui.quiz = null; ui.rv = null; ui.q = null; go("s1"); toast("進度已重設"); }
  }

function spellCheck() {

document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target && e.target.id === "spellin") { e.preventDefault(); spellCheck(); } });
